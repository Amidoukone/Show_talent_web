name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  production-config:
    name: Production config guardrail
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: .\scripts\check_admin_production_config.ps1

  contract:
    name: Admin / mobile contract check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: admin-repo
      # Cross-repo checkout: the contract check reads files from the sibling
      # mobile repo (Cloud Functions, firestore.rules, contract docs) that
      # don't exist in this repo. ADFOOT_CROSS_REPO_TOKEN needs at least
      # read access to Amidoukone/Show-Talent.
      #
      # No `ref:` on purpose -- this takes the mobile DEFAULT branch, and that
      # is the point. The contract check now also verifies that every callable
      # this portal calls exists in the backend, so a portal that calls a
      # callable not yet merged on the mobile side fails here. That is the
      # deploy order made mechanical: Cloud Functions and rules go out from
      # the mobile repo first, then the mobile build, then this portal.
      #
      # Do not pin a feature branch to make this job green. A green job would
      # then prove nothing about what is actually deployed, which is the one
      # thing this check exists to prove.
      - uses: actions/checkout@v4
        with:
          repository: Amidoukone/Show-Talent
          token: ${{ secrets.ADFOOT_CROSS_REPO_TOKEN }}
          path: mobile-repo
      - shell: powershell
        working-directory: admin-repo
        run: .\scripts\check_mobile_contract.ps1 -MobileRepoPath "${{ github.workspace }}\mobile-repo"
